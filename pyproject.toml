[project]
name = "voltpath-research"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "jupyterlab>=4",
    "pandas>=2",
    "plotly>=5",
    "requests>=2",
    "python-dotenv>=1",
    "pyarrow>=25.0.1",
    "powerlaw>=2.0.0",
    "networkx>=3.7",
]

[dependency-groups]
dev = [
    "pre-commit>=3",
    "nbstripout>=0.7",
    "kaleido>=0.2",
    "nbconvert>=7",
    "ruff>=0.16.9",
]

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
